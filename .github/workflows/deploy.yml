name: Test and Deploy Edge Function

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Two real bugs found deploying this for the first time, 2026-09-20 (see
      # supabase/cli#4927 and the Edge Functions "Managing dependencies" docs):
      #   1. `supabase functions deploy`'s bundler only reads .npmrc from
      #      inside the FUNCTION's own directory (supabase/functions/<name>/),
      #      never the repo root -- the root .npmrc that used to sit here was
      #      silently ignored the whole time.
      #   2. Its .npmrc reader does NOT reliably expand `${VAR}`-style env
      #      substitution the way `npm`/Node do -- the token must be written
      #      in literally. Generated fresh here, every run, from the
      #      workflow-scoped GITHUB_TOKEN (never a manually-managed PAT,
      #      never committed) -- requires this repo to be on
      #      pg-plan-guard's own "Manage Actions access" allowlist (a
      #      one-time, manual, org-owner-only grant -- see this org's root
      #      CLAUDE.md for why there's no API for it).
      - name: DEBUG - check package registry read access (temporary, remove after diagnosing)
        run: |
          echo "HTTP status for GET on the versions endpoint:"
          curl -s -o /dev/null -w "%{http_code}\n" -H "Authorization: Bearer ${GITHUB_TOKEN}" https://npm.pkg.github.com/@mp4marketing/pg-plan-guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Write per-function .npmrc for the private pg-plan-guard import
        run: |
          cat > supabase/functions/mcp-query-relay/.npmrc <<EOF
          @mp4marketing:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Deliberately WITHOUT --no-verify-jwt: Supabase's own platform gate
      # stays on as an outer defense-in-depth layer (doc 19) -- it checks
      # the standard Authorization header against Supabase's own key, fully
      # independent of this design's own X-Relay-Auth scheme.
      - run: supabase functions deploy mcp-query-relay --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
